services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server

  user-service:
    build: ./user-service
    ports:
      - "8081:8081"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      MONGO_DB_USER: ${MONGO_DB_USER}
      MONGO_DB_PASSWORD: ${MONGO_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      - eureka-server

  course-service:
    build: ./course-service
    ports:
      - "8082:8082"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      MONGO_DB_USER: ${MONGO_DB_USER}
      MONGO_DB_PASSWORD: ${MONGO_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      - eureka-server
      - rabbitmq

  notification-service:
    build: ./notification-service
    ports:
      - "8083:8083"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      MONGO_DB_USER: ${MONGO_DB_USER}
      MONGO_DB_PASSWORD: ${MONGO_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - eureka-server
      - rabbitmq

  training-service:
    build: ./training-service
    ports:
      - "8084:8084"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      MONGO_DB_USER: ${MONGO_DB_USER}
      MONGO_DB_PASSWORD: ${MONGO_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      - eureka-server
      - rabbitmq

  forum-service:
    build: ./forum-service
    ports:
      - "8085:8085"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      MONGO_DB_USER: ${MONGO_DB_USER}
      MONGO_DB_PASSWORD: ${MONGO_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - eureka-server
      - rabbitmq


  frontend:
    build:
      context: C:/Users/moham/Downloads/mantis-free-angular-admin-template-v6.0.0/omarise-frontend
    ports:
      - "4200:80"
    depends_on:
      - api-gateway