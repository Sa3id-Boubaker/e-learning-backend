apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: omarise
  labels:
    app: eureka-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: eureka-server
          image: ghcr.io/sa3id-boubaker/omarise-eureka-server:39
          ports:
            - containerPort: 8761
          # eureka-server has no externalized configuration: register-with-eureka
          # and fetch-registry are hardcoded to false in application.yml (it IS the
          # registry), so no env vars are required here.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 6
          # Starting values for Minikube only — not measured, adjust after observing
          # real usage (see k8s/README.md).
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
