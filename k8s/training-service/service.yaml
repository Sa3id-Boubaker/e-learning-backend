apiVersion: v1
kind: Service
metadata:
  name: training-service
  namespace: omarise
  labels:
    app: training-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/actuator/prometheus"
    prometheus.io/port: "8084"
spec:
  type: ClusterIP
  selector:
    app: training-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084
