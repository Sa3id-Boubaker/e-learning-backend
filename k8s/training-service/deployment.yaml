apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-service
  namespace: omarise
  labels:
    app: training-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: training-service
  template:
    metadata:
      labels:
        app: training-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: training-service
          image: ghcr.io/sa3id-boubaker/omarise-training-service:45
          ports:
            - containerPort: 8084
          env:
            - name: EUREKA_URI
              valueFrom:
                configMapKeyRef:
                  name: omarise-config
                  key: EUREKA_URI
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: omarise-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: omarise-config
                  key: RABBITMQ_PORT
            - name: MONGO_DB_USER
              valueFrom:
                secretKeyRef:
                  name: omarise-mongo
                  key: MONGO_DB_USER
            - name: MONGO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omarise-mongo
                  key: MONGO_DB_PASSWORD
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: omarise-rabbitmq
                  key: RABBITMQ_USERNAME
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omarise-rabbitmq
                  key: RABBITMQ_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: omarise-jwt
                  key: JWT_SECRET
            - name: CLOUDINARY_CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: omarise-cloudinary
                  key: CLOUDINARY_CLOUD_NAME
            - name: CLOUDINARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: omarise-cloudinary
                  key: CLOUDINARY_API_KEY
            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: omarise-cloudinary
                  key: CLOUDINARY_API_SECRET
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
