# EXAMPLE ONLY — do not apply as-is, do not commit real values.
#
# IMPORTANT — read before applying:
# The current docker-compose.yml runs RabbitMQ with NO explicit credentials, so every
# service falls back to spring.rabbitmq.username/password defaults ("guest"/"guest"),
# i.e. the well-known RabbitMQ default account. That is fine on a local Docker network
# that isn't reachable from outside, but leaving the well-known default credentials in
# place inside a shared Minikube cluster is a real (if modest) security weakness.
#
# This Secret introduces an explicit, changeable RabbitMQ account for Kubernetes: the
# same value is wired into the rabbitmq Deployment itself (as RABBITMQ_DEFAULT_USER /
# RABBITMQ_DEFAULT_PASS, the official rabbitmq image's own bootstrap variables) and into
# every service that talks to RabbitMQ (as RABBITMQ_USERNAME / RABBITMQ_PASSWORD, which
# spring.rabbitmq.username/password already reads). This is a deliberate improvement
# over the current default-credentials setup, not a value discovered in the repo —
# see the BLOCKERS / notes section of the Kubernetes phase report for details.
#
# Consumed by: rabbitmq (as defaults), course-service, training-service, forum-service,
# notification-service. user-service and api-gateway do not use RabbitMQ.
apiVersion: v1
kind: Secret
metadata:
  name: omarise-rabbitmq
  namespace: omarise
type: Opaque
stringData:
  RABBITMQ_USERNAME: CHANGE_ME
  RABBITMQ_PASSWORD: CHANGE_ME
