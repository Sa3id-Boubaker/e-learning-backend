# EXAMPLE ONLY — do not apply as-is, do not commit real values.
# Consumed by: user-service, course-service, training-service
# (cloudinary.cloud-name / cloudinary.api-key / cloudinary.api-secret).
# forum-service and notification-service do not use Cloudinary.
#
# Note: CLOUDINARY_CLOUD_NAME is technically not sensitive information (it appears in
# every public Cloudinary asset URL), but this project's own Jenkins pipeline already
# stores it as a credential (credentials('cloudinary-cloud-name')), not as a plain
# parameter. To stay consistent with how the project already treats this value, and
# since its real value isn't visible anywhere in the source code to copy safely, it is
# kept in this Secret rather than in the plain ConfigMap. See k8s/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: omarise-cloudinary
  namespace: omarise
type: Opaque
stringData:
  CLOUDINARY_CLOUD_NAME: CHANGE_ME
  CLOUDINARY_API_KEY: CHANGE_ME
  CLOUDINARY_API_SECRET: CHANGE_ME
