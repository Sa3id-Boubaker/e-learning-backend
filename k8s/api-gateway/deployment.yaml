apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: omarise
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api-gateway
          image: ghcr.io/sa3id-boubaker/omarise-api-gateway:45
          ports:
            - containerPort: 8080
          env:
            # eureka.client.service-url.defaultZone: ${EUREKA_URI:...} in application.yml.
            # api-gateway does not use MongoDB, RabbitMQ or JWT.
            - name: EUREKA_URI
              valueFrom:
                configMapKeyRef:
                  name: omarise-config
                  key: EUREKA_URI
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
