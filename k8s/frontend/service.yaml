apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: omarise
  labels:
    app: frontend
spec:
  # First Minikube iteration only — no Ingress yet, per this phase's scope.
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      # nodePort intentionally omitted — let Kubernetes assign one
      # (retrieve it later with: kubectl get svc frontend -n omarise).
