apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: omarise
  labels:
    app: notification-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/actuator/prometheus"
    prometheus.io/port: "8083"
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
