apiVersion: v1
kind: Service
metadata:
  name: course-service
  namespace: omarise
  labels:
    app: course-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/actuator/prometheus"
    prometheus.io/port: "8082"
spec:
  type: ClusterIP
  selector:
    app: course-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
