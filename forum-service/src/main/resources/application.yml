spring:
  application:
    name: forum-service
  mongodb:
    uri: mongodb+srv://${MONGO_DB_USER}:${MONGO_DB_PASSWORD}@cluster0.fjb1pp5.mongodb.net/forum-db?retryWrites=true&w=majority
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
